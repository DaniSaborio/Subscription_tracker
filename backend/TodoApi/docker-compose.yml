services:
  postgres:
    image: postgres:16-alpine
    container_name: subscription_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subscription_tracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - subscription_tracker_pgdata:/var/lib/postgresql/data
      - ./Scripts/02_create_table_tasks.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Scripts/03_seed_tasks.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscription_tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  subscription_tracker_pgdata:
