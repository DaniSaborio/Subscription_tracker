version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: subscription_tracker_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: subscription_tracker_dev
      POSTGRES_DB: subscription_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - subscription_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d subscription_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Subscription_tracker.API
      dockerfile: Dockerfile
    container_name: subscription_tracker_api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=subscription_tracker;User Id=admin;Password=subscription_tracker_dev;
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - subscription_network

volumes:
  postgres_data:

networks:
  subscription_network:
    driver: bridge
